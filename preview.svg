  <text x="342" y="175" fill="#b83a4a" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace">openNote()</text>
  <text x="426" y="176" fill="#f2e8ea" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">and let one garnet stroke land.</text>

  <rect x="284" y="198" width="640" height="44" rx="6" fill="rgba(184, 58, 74, 0.1)"/>
  <rect x="284" y="198" width="4" height="44" rx="2" fill="#b83a4a"/>
  <text x="302" y="225" fill="rgba(242, 232, 234, 0.52)" font-size="14" font-style="italic" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Garnet on mineral dark. One mark is enough.</text>

  <circle cx="292" cy="268" r="3" fill="#b83a4a"/>
  <text x="304" y="272" fill="#f2e8ea" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">cut the stone</text>
  <circle cx="292" cy="292" r="3" fill="#b83a4a"/>
  <text x="304" y="296" fill="#f2e8ea" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">then the note</text>
  <circle cx="292" cy="316" r="3" fill="#b83a4a"/>
  <text x="304" y="320" fill="#f2e8ea" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">then the quiet</text>

  <text x="284" y="358" fill="#f2e8ea" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">See also</text>
  <text x="344" y="358" fill="#b83a4a" font-size="14" text-decoration="underline" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Garnet stone</text>
  <text x="442" y="358" fill="#f2e8ea" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">when the jar cools.</text>

