  <text x="22" y="152" fill="#b83a4a" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Vein of garnet</text><text x="22" y="170" fill="rgba(242, 232, 234, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">One red stroke on stone...</text>
  <text x="22" y="216" fill="#f2e8ea" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Garnet stone</text><text x="22" y="234" fill="rgba(242, 232, 234, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Mineral first, then the mark.</text>
  <text x="22" y="280" fill="#f2e8ea" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Mineral night</text><text x="22" y="298" fill="rgba(242, 232, 234, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Powder, binder, then the page.</text>
  <text x="22" y="344" fill="#f2e8ea" font-size="13" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Deep red</text><text x="22" y="362" fill="rgba(242, 232, 234, 0.52)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Keep the garnet for emphasis.</text>

  <rect x="248" y="42" width="712" height="470" fill="#120e10"/>

  <text x="284" y="90" fill="#f2e8ea" font-size="28" font-weight="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Vein of garnet</text>
  <text x="284" y="114" fill="rgba(242, 232, 234, 0.34)" font-size="11" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Today &#183; Markdown</text>

  <text x="284" y="154" fill="#f2e8ea" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">The mineral night had settled when I sat down.</text>
  <text x="284" y="176" fill="#f2e8ea" font-size="14" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">I wrote</text>
